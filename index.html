<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>GitHub Pages Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f6f8fa;
            color: #24292e;
        }
        .container {
            text-align: center;
            padding: 2rem;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            background-color: #ffffff;
            box-shadow: 0 1px 3px rgba(27,31,35,0.12);
        }
        .status-indicator {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitHub Pages Deployment</h1>
        <p>Status: <span class="status-indicator">Active</span></p>
        <p>Domain Verification Successful.</p>
        <small id="timestamp"></small>
    </div>

    <script>
        // Injecting local ISO timestamp for cache-busting verification
        document.getElementById('timestamp').textContent = 'Last Rendered: ' + new Date().toISOString();
    </script>
</body>
</html>
